<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="Line drawing of a gecko" style="color:#f4f8ee">
  <title>Gecko</title>
  <!-- PLACEHOLDER ARTWORK.
       Swap this whole file for real artwork when it arrives; keep the viewBox
       near 240x150 or update .nudi-art in index.html. Strokes use currentColor
       so the app can recolour it against any background. -->
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <!-- body, head at the left, tail curling up at the right -->
    <path d="M40 74 C40 62 52 56 66 56 C86 56 104 62 124 66
             C140 69 154 70 166 68 C182 65 190 56 188 46
             C186 37 176 33 168 37 C162 40 161 47 165 51"
          fill="none"/>

    <!-- belly line back to the head -->
    <path d="M40 74 C40 86 52 92 66 92 C88 92 106 86 124 82"
          stroke-width="2.4" stroke-opacity="0.75"/>

    <!-- head -->
    <path d="M40 74 C30 74 22 70 20 64 C18 57 24 51 33 51 C39 51 40 56 40 60"
          fill="none"/>

    <!-- front leg and foot -->
    <path d="M66 90 L60 106 L48 112"/>
    <path d="M48 112 l-7 4 M48 112 l-3 8 M48 112 l3 7"/>
    <!-- back leg and foot -->
    <path d="M120 82 L128 100 L142 106"/>
    <path d="M142 106 l7 5 M142 106 l3 8 M142 106 l-4 7"/>
  </g>

  <!-- eye -->
  <circle cx="30" cy="61" r="4.5" fill="#e8b13d"/>
  <circle cx="30" cy="61" r="1.6" fill="#0d2318"/>

  <!-- dorsal markings, the way Naultinus carries its blotches -->
  <g fill="#8fd49c" fill-opacity="0.85">
    <ellipse cx="62"  cy="70" rx="7" ry="4.5"/>
    <ellipse cx="86"  cy="72" rx="6" ry="4"/>
    <ellipse cx="110" cy="74" rx="5.5" ry="3.6"/>
    <ellipse cx="134" cy="72" rx="4.5" ry="3"/>
    <ellipse cx="156" cy="68" rx="3.6" ry="2.6"/>
  </g>
</svg>
