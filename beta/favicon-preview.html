<!DOCTYPE html>
<html>
<head><style>
  body { background: #f0f0f0; display: flex; align-items: center; gap: 40px; padding: 40px; font-family: sans-serif; }
  .box { text-align: center; }
  .box p { margin: 8px 0 0; font-size: 12px; color: #666; }
  img { display: block; image-rendering: pixelated; }
  .tab-sim { background: #e8e8e8; border-radius: 8px 8px 0 0; padding: 8px 16px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333; width: 180px; }
</style></head>
<body>
  <div class="box">
    <img src="favicon.svg" width="64" height="64">
    <p>64px</p>
  </div>
  <div class="box">
    <img src="favicon.svg" width="32" height="32">
    <p>32px</p>
  </div>
  <div class="box">
    <img src="favicon.svg" width="16" height="16">
    <p>16px (actual tab size)</p>
  </div>
  <div class="box">
    <div class="tab-sim">
      <img src="favicon.svg" width="16" height="16">
      occurd. · Rutherford Ecology
    </div>
    <p>In a browser tab</p>
  </div>
</body>
</html>
